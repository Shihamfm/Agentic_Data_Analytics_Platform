[project]
name = "agentic-data-analytics-platform"
version = "0.1.0"
description = "Agentic Data Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "plotly>=5.15.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.0",
    "uvicorn>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]