[project]
name = "agentic-data-analytics-platform"
version = "0.1.0"
description = "Agentic Data Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.104.0",
    "groq>=0.37.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "plotly>=5.15.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.0",
    "supabase>=2.31.0",
    "uvicorn>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
